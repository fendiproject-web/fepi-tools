<!-- TIKTOK DOWNLOADER -->
<div id="tiktokDownloaderPage" class="page-section">
  <button class="back-btn" onclick="showPage('homePage')">
    <svg class="icon-svg" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg> Kembali
  </button>
  <h2 class="page-title">TikTok Downloader</h2>
  <div class="input-wrapper">
    <input type="text" id="tiktokUrl" class="input-box" placeholder="Tempel URL TikTok...">
    <button class="paste-btn" onclick="pasteFromClipboard('tiktokUrl')">
      <svg class="icon-svg" viewBox="0 0 24 24"><path d="M19 2h-4.18C14.4.84 13.3 0 12 0c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
      Tempel
    </button>
  </div>
  <button class="action-btn" onclick="fetchTikTok()">
    <svg class="icon-svg" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5z"/></svg> Cari & Download
  </button>
  <div class="loader" id="loader">
    <svg class="icon-svg spinner-svg" viewBox="0 0 24 24"><path d="M12 4V2A10 10 0 0 0 2 12h2a8 8 0 0 1 8-8z"/></svg> Memuat Data...
  </div>
  <div class="result-card" id="resultCard">
    <div class="profile-header" id="tiktokProfileHeader"></div>
    <div class="media-container" id="mediaBox"></div>
    <div class="caption-text" id="captionText"></div>
    <div class="dl-btn-group" id="downloadButtons"></div>
  </div>
</div>
