<!-- BRAT -->
<div id="bratMakerPage" class="page-section">
  <button class="back-btn" onclick="showPage('homePage')">
    <svg class="icon-svg" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg> Kembali
  </button>
  <h2 class="page-title">Brat Generator</h2>
  <div class="input-wrapper">
    <input type="text" id="bratText" class="input-box" placeholder="Tulis teks Brat...">
    <button class="paste-btn" onclick="pasteFromClipboard('bratText')">
      <svg class="icon-svg" viewBox="0 0 24 24"><path d="M19 2h-4.18C14.4.84 13.3 0 12 0c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
      Tempel
    </button>
  </div>
  <button class="action-btn" onclick="generateBrat()">
    <svg class="icon-svg" viewBox="0 0 24 24"><path d="M7.5 5.6L5 7l1.4-2.5L5 2l2.5 1.4L10 2 8.6 4.5 10 7 7.5 5.6z"/></svg> Buat Gambar
  </button>
  <div class="loader" id="bratLoader">
    <svg class="icon-svg spinner-svg" viewBox="0 0 24 24"><path d="M12 4V2A10 10 0 0 0 2 12h2a8 8 0 0 1 8-8z"/></svg> Membuat Gambar...
  </div>
  <div class="result-card" id="bratResultCard">
    <div class="media-container" id="bratMediaBox"></div>
    <div class="dl-btn-group" id="bratDownloadButtons"></div>
  </div>
</div>
